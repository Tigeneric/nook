# The canonical Xcode project definition — Nook.xcodeproj is GENERATED
# (`make generate`) and gitignored. All the code lives in the local SPM
# package; this target only wraps it into an .app.
name: Nook
options:
  bundleIdPrefix: com.khabirov
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    # The single place the version is set. Info.plist only references these,
    # so a release means editing one line and tagging the commit.
    MARKETING_VERSION: "0.1.5"        # what a person sees
    CURRENT_PROJECT_VERSION: "6"      # build number, grows monotonically
    # Substituted from the environment at `xcodegen generate` time; the
    # Makefile provides a default. Another account or CI:
    # `DEVELOPMENT_TEAM=XXX make app`.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
packages:
  NookPackage:
    path: .
targets:
  NookApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/Nook
        excludes:
          - "Info.plist"
          - "Resources/**"
      # Xcode compiles the string catalog into .lproj folders in the bundle.
      - path: Sources/Nook/Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: NookPackage
        product: NookCore
      - package: NookPackage
        product: NookSheet
    settings:
      base:
        PRODUCT_NAME: Nook
        PRODUCT_BUNDLE_IDENTIFIER: com.khabirov.nook
        INFOPLIST_FILE: Sources/Nook/Info.plist
        # Sources/Nook/Assets.xcassets, rendered from tools/AppIcon.svg.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # So that ⌘U in Xcode runs the same tests CI does.
    scheme:
      testTargets:
        - NookCoreTests
        - NookSheetTests
        - NookTests

  # The tests belong to the SPM package and `swift test` is what CI runs;
  # these targets exist so that the generated project is not a half-broken
  # thing in the editor. Without them the test files belong to no target, and
  # Xcode marks every `import Testing` as an unresolved module.
  NookCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/NookCoreTests]
    dependencies:
      - package: NookPackage
        product: NookCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.khabirov.nook.NookCoreTests

  NookSheetTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/NookSheetTests]
    dependencies:
      - package: NookPackage
        product: NookCore
      - package: NookPackage
        product: NookSheet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.khabirov.nook.NookSheetTests

  # Unlike the two above, this one reaches into the app module itself
  # (`@testable import Nook`), so it needs a host to be loaded into — hence the
  # dependency on `NookApp`.
  #
  # The host is spelled out rather than left to XcodeGen: it derives the path
  # from the target name (`NookApp.app/…/NookApp`), and the product is renamed
  # to `Nook`. Without these two lines the build fails with “Could not find
  # test host”.
  NookTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/NookTests]
    dependencies:
      - target: NookApp
      - package: NookPackage
        product: NookCore
      - package: NookPackage
        product: NookSheet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.khabirov.nook.NookTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Nook.app/Contents/MacOS/Nook
        BUNDLE_LOADER: $(TEST_HOST)
